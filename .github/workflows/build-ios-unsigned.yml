name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Synchronize Capacitor iOS project
        run: npx cap sync ios

      - name: Build iOS application without code signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/package/Payload/
          cd build/package
          zip -qry Bertello-Track-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Bertello-Track-unsigned-ipa
          path: build/package/Bertello-Track-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

